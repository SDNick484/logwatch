[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logwatch"
version = "0.1.0"
description = "Read-only service and log watcher with a tool-less LLM digest"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
logwatch = "logwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
